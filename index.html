function setDocCk(k,id,v){const d=S[k].find(x=>x.id==id);if(!d)return;d.cachet=v;save();viewDoc(k,id)}
const applyLogo=()=>{LOGO=(S.cfg&&S.cfg.logo)||LOGO0;const R=document.documentElement;R.style.setProperty('--lg','url("'+LOGO+'")');R.classList.toggle('lgc',!!(S.cfg&&S.cfg.logo));
 try{[['icon',''],['apple-touch-icon','']].forEach(([rel])=>{let l=document.querySelector('link[rel="'+rel+'"]');if(!l){l=document.createElement('link');l.rel=rel;document.head.appendChild(l)}l.href=LOGO})}catch(e){}};applyLogo();

function decorTables(){
 return;
 try{
  document.querySelectorAll('table:not(.ctb):not(.dtb):not(.ptb)').forEach(t=>{
   if(t.closest('.doc,.dw'))return;
   const hr=t.tHead&&t.tHead.rows[0]||t.rows[0];if(!hr)return;
   const hs=[...hr.cells].map(c=>c.textContent.trim());
   const rows=(t.tBodies.length?[...t.tBodies].flatMap(b=>[...b.rows]):[...t.rows].slice(1)).concat(t.tFoot?[...t.tFoot.rows]:[]);
   rows.forEach(r=>{let i=0;[...r.cells].forEach(c=>{
     const span=c.colSpan||1,lb=span==1?hs[i]:'';
     if(lb)c.setAttribute('data-l',lb);
     if(c.querySelector('button,a.btn,input,select'))c.classList.add('ctl');
     i+=span})});
   t.classList.add('ctb');const w=t.closest('.tw');if(w)w.classList.add('ctbw');
  });
 }catch(e){}
}
try{new MutationObserver(()=>decorTables()).observe(document.body,{childList:true,subtree:true});decorTables()}catch(e){}

 else{const ca=F.reduce((a,f)=>a+f.lines.reduce((b,l)=>b+net(f,l),0),0),co=F.reduce((a,f)=>a+f.lines.reduce((b,l)=>b+l.q*(l.pa||0),0),0),dp=S.depenses.filter(d=>(!R1||d.date>=R1)&&(!R2||d.date<=R2)).reduce((a,d)=>a+d.montant,0);

lient" autocomplete="off"></label></div><button class="p" style="width:100%" onclick="addCli()">Enregistrer le client</button><div id="nc_msg" style="margin-top:6px"></div></div><label>Mode de paiement<select onchange="PM=this.value">${MODES.map(m=>`<option ${PM==m?'selected':''}>${m}</option>`).join('')}</select></label><div style="margin:8px 0"><b>Cachet</b><div class="ckb" style="margin-top:4px">${ckBtns(PK,"PK='%v';refC()")}</div></div><div class="tot">Total : <b style="font-size:22px">${fmt(t)}</b></div><label>Montant reçu<input type="number" value="${PPAY==null?Math.round(t):PPAY}" onchange="PPAY=+this.value||0;refC()"></label><p>Reste à payer : <b class="${(PPAY==null?0:t-PPAY)>0.5?'bad':'ok'}">${fmt(PPAY==null?0:Math.max(0,t-PPAY))}</b></p><button class="p" style="width:100%;padding:11px" onclick="pay()">Encaisser & imprimer</button><button style="width:100%;margin-top:6px" onclick="CART=[];PPAY=null;PR=0;PK='';refC()">Vider le panier</button>`;

function addC(id){const p=S.produits.find(x=>x.id==id),l=CART.find(x=>x.p==id);if(l)l.q++;else CART.push({p:id,q:1,pu:p.pv,pa:p.pa});PPAY=null;refC()}

async function pay(){
 if(!CART.length)return alert('Le panier est vide.');
 const bad=CART.filter(l=>l.q>(S.produits.find(p=>p.id==l.p)||{}).stock);
 if(bad.length&&!(await askOk('Stock insuffisant pour certains produits. Continuer ?')))return;
 const f={id:nid(),num:nextNum('factures'),date:today(),tiers:PC,lines:CART.map(l=>({...l})),rem:PR,paye:0,mode:PM,cachet:PK};
 f.paye=PPAY==null?tot(f):PPAY;
 S.factures.push(f);apply('factures',f,1);save();
 CART=[];PPAY=null;PR=0;CQ='';PK='';render();viewDoc('factures',f.id);
}

const MQT='QUINCAILLERIE GÉNÉRALE TOURÉ & FRÈRES 17.21',mqh=c=>{const u=Array(8).fill(MQT).join(' ★ ')+' ★ ';return `<div class="mq ${c}"><span>${u}${u}</span></div>`};
const dots=()=>{const e=$('#dots');if(e)e.textContent='●'.repeat(PIN.length)+'○'.repeat(4-PIN.length)};
function key(k){
 if(AUTH)return;const pe=$('#pe');
 if(Date.now()<LOCK){pe.textContent='Trop d’essais. Réessayez dans '+Math.ceil((LOCK-Date.now())/1000)+' s.';return}
 if(k=='C')PIN='';else if(k=='<')PIN=PIN.slice(0,-1);else if(PIN.length<4)PIN+=k;
 dots();
 if(PIN.length==4){
  if(PIN==(S.cfg.pin||'2026')){AUTH=true;FAIL=0;try{sessionStorage.setItem('qgtf_ok','1')}catch(e){}PIN='';render()}
  else{FAIL++;pe.textContent='Code incorrect';if(FAIL>=5){LOCK=Date.now()+30000;FAIL=0}setTimeout(()=>{PIN='';dots()},350)}
 }
}
document.addEventListener('keydown',e=>{if(AUTH)return;if(/^\d$/.test(e.key))key(e.key);else if(e.key=='Backspace')key('<')});

async function regler(id){
 const x=S.prets.find(a=>a.id==id);if(!x)return;
 const reste=Math.round((+x.montant||0)-(+x.rembourse||0)),
  q=x.type=='Emprunt reçu'?'Montant payé à '+x.tiers:'Montant reçu de '+x.tiers,
  v=await askVal(q+' (reste : '+fmt(reste)+')',reste);
 if(v===null)return;const m=+v;
 if(!(m>0))return alert('Montant invalide.');
 if(m>reste+0.5)return alert('Le montant dépasse le reste à régler ('+fmt(reste)+').');
 x.rembourse=(+x.rembourse||0)+m;save();render();toast(x.rembourse>=x.montant-0.5?'Réglé en totalité ✓':'Règlement enregistré ✓');
}
async function encaisser(k,id){
 const f=S[k].find(x=>x.id==id),reste=Math.round(tot(f)-(f.paye||0)),v=await askVal((k=='arrivages'?'Montant payé au fournisseur (reste à payer : ':'Montant encaissé (reste à payer : ')+fmt(reste)+')',reste);

 f.paye=(f.paye||0)+m;save();render();if(k=='factures')viewDoc(k,id);
}

/* Informations de l'entreprise : toutes les lignes ont exactement la même largeur (même taille d'écriture, espacement réparti) */
function eqInfo(d){
 try{
  const box=d.querySelector('.m-in'),nm=d.querySelector('.m-nm');if(!box||!nm)return;
  const ls=[...box.children];if(!ls.length)return;
  const wd=e=>{const r=d.createRange();r.selectNodeContents(e);return r.getBoundingClientRect().width};
  // 4 grandes lignes sur toute la largeur de la facture
  box.style.width='auto';box.style.margin='8px 0 0';
  const W=Math.floor(box.clientWidth);if(!(W>50))return;
  ls.forEach(e=>{e.style.cssText='display:block;white-space:normal;text-wrap:balance;word-spacing:0;letter-spacing:0;margin:0'});
  // plus grande écriture possible (21 → 15 px) pour que chaque information tienne sur une seule ligne dans cette largeur
  const sl=box.querySelector('.m-sl'),ot=ls.filter(e=>e!==sl);
  const one=()=>ot.every(e=>e.getBoundingClientRect().height<=(parseFloat(d.defaultView.getComputedStyle(e).lineHeight)||20)*1.5);
  let fs=30;box.style.fontSize=fs+'px';
  while(fs>14&&!one()){fs-=0.5;box.style.fontSize=fs+'px'}
  if(sl){const slh=()=>(parseFloat(d.defaultView.getComputedStyle(sl).lineHeight)||20)*1.5;let f2=fs;while(f2>10&&sl.getBoundingClientRect().height>slh()){f2-=0.5;sl.style.fontSize=f2+'px'}}
  ot.forEach(e=>{
   const lh=parseFloat(d.defaultView.getComputedStyle(e).lineHeight)||20;
   if(e.getBoundingClientRect().height>lh*1.5)return; // ligne coupée en deux : centrée telle quelle
   const w=wd(e),extra=W-w;if(extra<1)return;
   const t=e.textContent,gaps=(t.match(/ /g)||[]).length,n=[...t].length;
   const wsp=gaps?Math.min(extra/gaps,10):0;
   const lsp=n>1?Math.min((extra-wsp*gaps)/(n-1),2):0;
   e.style.wordSpacing=wsp.toFixed(2)+'px';
   e.style.letterSpacing=lsp.toFixed(3)+'px';
   e.style.marginRight='-'+lsp.toFixed(3)+'px';
  });
 }catch(e){}
}

  obj(pg+1,'<</Length '+c.length+'>>\nstream\n'+c+'\nendstream');
  offs[pg+2]=len;
  put((pg+2)+' 0 obj\n<</Type/XObject/Subtype/Image/Width '+p.w+'/Height '+p.h+'/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length '+p.jpg.length+'>>\nstream\n');

 let xr='xref\n0 '+N+'\n0000000000 65535 f \n';
 for(let i=1;i<N;i++)xr+=String(offs[i]).padStart(10,'0')+' 00000 n \n';

import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDjNqfxVaowWK8Js3vHSrwttjKe8Pp4ch8",
  authDomain: "qgtf-1721.firebaseapp.com",
  projectId: "qgtf-1721",

  messagingSenderId: "655499493529",
  appId: "1:655499493529:web:efe2d62618c802a700b808"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const refDoc = doc(db, "qgtf-data", "principal");

const K = "qgtf_v1";                 // données du logiciel
const B = "qgtf_sync_base";          // dernière version synchronisée avec le cloud
const BK = "qgtf_backup_avant_sync"; // copie de sécurité avant remplacement
const loc = () => localStorage.getItem(K);
const base = () => localStorage.getItem(B);
const setBase = v => { try { localStorage.setItem(B, v); } catch (e) {} };
let ready = false, pushing = false;

async function push(v) {
  if (pushing) return;
  pushing = true;
  try { await setDoc(refDoc, { qgtf_v1: v, maj: Date.now() }); setBase(v); } catch (e) {}
  pushing = false;
}

function take(cloud) {
  try {
    const l = loc();
    if (l) localStorage.setItem(BK, l);
    localStorage.setItem(K, cloud);
    setBase(cloud);
  } catch (e) { return; }
  location.reload();
}

onSnapshot(refDoc, snap => {
  if (snap.metadata.fromCache || snap.metadata.hasPendingWrites) return;
  const cloud = snap.exists() ? snap.data().qgtf_v1 : null;
  const l = loc(), b = base();
  if (!cloud) { ready = true; if (l) push(l); return; }
  if (cloud === l) { setBase(cloud); ready = true; return; }
  if (!l) { take(cloud); return; }
  if (b !== null && l === b) { take(cloud); return; }
  if (b !== null && cloud === b) { ready = true; push(l); return; }
  if (confirm("Les données en ligne sont différentes de celles de cet appareil.\n\nOK = utiliser les données en ligne\nAnnuler = garder celles de cet appareil et remplacer les données en ligne")) take(cloud);
  else { ready = true; push(l); }
}, () => {});

setInterval(() => {
  if (!ready) return;
  const l = loc();
  if (l && l !== base()) push(l);
}, 3000);
</script>
