/* Tableaux en fiches sur petit écran : chaque cellule reçoit le nom de sa colonne */
function decorTables(){
 return;
 try{
  document.querySelectorAll('table:not(.ctb):not(.dtb):not(.ptb)').forEach(t=>{
   if(t.closest('.doc,.dw'))return;
   const hr=t.tHead&&t.tHead.rows[0]||t.rows[0];if(!hr)return;
   const hs=[...hr.cells].map(c=>c.textContent.trim());
   const rows=(t.tBodies.length?[...t.tBodies].flatMap(b=>[...b.rows]):[...t.rows].slice(1)).concat(t.tFoot?[...t.tFoot.rows]:[]);
   rows.forEach(r=>{let i=0;[...r.cells].forEach(c=>{
     const span=c.colSpan||1,lb=span==1?hs[i]:'';
     if(lb)c.setAttribute('data-l',lb);
     if(c.querySelector('button,a.btn,input,select'))c.classList.add('ctl');
     i+=span})});
   t.classList.add('ctb');const w=t.closest('.tw');if(w)w.classList.add('ctbw');
  });
 }catch(e){}
}
try{new MutationObserver(()=>decorTables()).observe(document.body,{childList:true,subtree:true});decorTables()}catch(e){}

function sumTot(){

 document.querySelectorAll('#tb tr').forEach((r,i)=>{if(r.style.display==='none'||!RV[i])return;n++;for(const k in RV[i])t[k]=(t[k]||0)+RV[i][k]});

}

 RV=S[k].map(x=>({pa:(+x.pa||0)*(+x.stock||0),pv:(+x.pv||0)*(+x.stock||0),stock:+x.stock||0,ben:((+x.pv||0)-(+x.pa||0))*(+x.stock||0),montant:+x.montant||0,rembourse:+x.rembourse||0,reste:(+x.montant||0)-(+x.rembourse||0)}));

function pickImg(inp,n){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=360,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);const d=c.toDataURL('image/jpeg',.8);$('#f_'+n).value=d;setPv(n,d)};im.src=r.result};r.readAsDataURL(f)}
function pcard(p,price,click,off,n,lab){

}
const nrm=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const qm=(t,q)=>{t=nrm(t);return nrm(q).split(/\s+/).filter(Boolean).every(w=>t.includes(w))};
const pmatch=(p,q)=>!q||qm([p.nom,p.ref,p.cat,p.categorie].join(' '),q);
const cmatch=(c,q)=>{if(!q||!q.trim())return true;if(qm([c.nom,c.tel,c.adr].join(' '),q))return true;const d=q.replace(/\D/g,'');return d.length>=3&&String(c.tel||'').replace(/\D/g,'').includes(d)};
const tOpts=(L,q,sel)=>{let l=L.filter(c=>cmatch(c,q));if(!l.length)l=L;else if(!l.some(c=>c.id==sel)){const s0=L.find(c=>c.id==sel);if(s0)l=[s0].concat(l)}return l.map(c=>`<option value="${c.id}" ${c.id==sel?'selected':''}>${esc(c.nom)}${c.tel?' · '+esc(c.tel):''}</option>`).join('')};
const cMsg=(L,q)=>{if(!q||!q.trim())return '';const n=L.filter(c=>cmatch(c,q)).length;return n?n+' trouvé'+(n>1?'s':''):'Aucun résultat'};

async function del(k,id){

/* Informations de l'entreprise : toutes les lignes ont exactement la même largeur (même taille d'écriture, espacement réparti) */
function eqInfo(d){
 try{
  const box=d.querySelector('.m-in'),nm=d.querySelector('.m-nm');if(!box||!nm)return;
  const ls=[...box.children];if(!ls.length)return;
  const wd=e=>{const r=d.createRange();r.selectNodeContents(e);return r.getBoundingClientRect().width};
  // 4 grandes lignes sur toute la largeur de la facture
  box.style.width='auto';box.style.margin='8px 0 0';
  const W=Math.floor(box.clientWidth);if(!(W>50))return;
  ls.forEach(e=>{e.style.cssText='display:block;white-space:normal;text-wrap:balance;word-spacing:0;letter-spacing:0;margin:0'});
  // plus grande écriture possible (21 → 15 px) pour que chaque information tienne sur une seule ligne dans cette largeur
  const sl=box.querySelector('.m-sl'),ot=ls.filter(e=>e!==sl);
  const one=()=>ot.every(e=>e.getBoundingClientRect().height<=(parseFloat(d.defaultView.getComputedStyle(e).lineHeight)||20)*1.5);
  let fs=30;box.style.fontSize=fs+'px';
  while(fs>14&&!one()){fs-=0.5;box.style.fontSize=fs+'px'}
  if(sl){const slh=()=>(parseFloat(d.defaultView.getComputedStyle(sl).lineHeight)||20)*1.5;let f2=fs;while(f2>10&&sl.getBoundingClientRect().height>slh()){f2-=0.5;sl.style.fontSize=f2+'px'}}
  ot.forEach(e=>{
   const lh=parseFloat(d.defaultView.getComputedStyle(e).lineHeight)||20;
   if(e.getBoundingClientRect().height>lh*1.5)return; // ligne coupée en deux : centrée telle quelle
   const w=wd(e),extra=W-w;if(extra<1)return;
   const t=e.textContent,gaps=(t.match(/ /g)||[]).length,n=[...t].length;
   const wsp=gaps?Math.min(extra/gaps,10):0;
   const lsp=n>1?Math.min((extra-wsp*gaps)/(n-1),2):0;
   e.style.wordSpacing=wsp.toFixed(2)+'px';
   e.style.letterSpacing=lsp.toFixed(3)+'px';
   e.style.marginRight='-'+lsp.toFixed(3)+'px';
  });
 }catch(e){}
}

/* Police Figtree intégrée dans la « photo » (sinon la police du PDF serait différente de celle de l'écran) */
let FONTCSS=null;
const withTO=(p,ms,msg)=>Promise.race([p,new Promise((_,ko)=>setTimeout(()=>ko(new Error(msg||'timeout')),ms))]);
const blobData=b=>new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=ko;r.readAsDataURL(b)});
async function fontCss(){
 if(FONTCSS!==null)return FONTCSS;
 try{const c=localStorage.getItem('qgtf_font1');if(c&&c.length>1000)return FONTCSS=c}catch(e){}
 let out='';
 try{
  let css=await withTO(fetch(GFONT).then(r=>r.text()),6000);
  const bl=[...css.matchAll(/\/\*\s*([\w-]+)\s*\*\/\s*(@font-face\s*\{[^}]*\})/g)].filter(m=>m[1]=='latin'||m[1]=='latin-ext').map(m=>m[2]);
  if(bl.length)css=bl.join('\n');
  const urls=[...new Set([...css.matchAll(/url\(["']?(https:[^)"']+)["']?\)/g)].map(m=>m[1]))];
  const dats=await Promise.all(urls.map(u=>withTO(fetch(u).then(r=>r.blob()).then(blobData),8000)));
  urls.forEach((u,i)=>{css=css.split(u).join(dats[i])});
  out=css;
  try{if(out.length>1000)localStorage.setItem('qgtf_font1',out)}catch(e){}
 }catch(e){out=''}
 return FONTCSS=out;
}
async function sheetXhtml(d){

 root.querySelectorAll('link,script').forEach(e=>e.remove());
 const st=d.createElement('style');st.textContent=fc;root.querySelector('head').appendChild(st);
 return new XMLSerializer().serializeToString(root);
}
const loadImg=src=>withTO(new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>ko(new Error('img'));i.src=src}),15000,'img timeout');
/* Dessine la tranche [y0,y0+h] de la feuille dans ctx, à (dx,dy), agrandie de k */
async function drawSlice(xhtml,H,y0,h,ctx,dx,dy,k,warm){
 const svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+SHEET_W+'" height="'+h+'" viewBox="0 '+y0+' '+SHEET_W+' '+h+'"><foreignObject x="0" y="0" width="'+SHEET_W+'" height="'+H+'">'+xhtml+'</foreignObject></svg>';
 const src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
 if(warm){const w=await loadImg(src);const t=document.createElement('canvas');t.width=t.height=2;t.getContext('2d').drawImage(w,0,0,2,2);await new Promise(r=>setTimeout(r,40))}
 const img=await loadImg(src);
 ctx.drawImage(img,dx,dy,SHEET_W*k,h*k);
}
const toJpg=c=>new Promise((ok,ko)=>c.toBlob(b=>b?b.arrayBuffer().then(x=>ok(new Uint8Array(x))):ko(new Error('jpg')),'image/jpeg',0.92));
/* Écrit un PDF A4 simple : une image JPEG plein page par page (aucune bibliothèque externe) */
function jpegPdf(pages,title){
 const enc=new TextEncoder(),parts=[],offs=[];let len=0;
 const put=x=>{const b=typeof x=='string'?enc.encode(x):x;parts.push(b);len+=b.length};
 const obj=(n,body)=>{offs[n]=len;put(n+' 0 obj\n'+body+'\nendobj\n')};
 const PW='595.28',PHt='841.89',n=pages.length;
 put('%PDF-1.4\n');put(new Uint8Array([37,226,227,207,211,10]));
 obj(1,'<</Type/Catalog/Pages 2 0 R>>');
 obj(2,'<</Type/Pages/Count '+n+'/Kids['+pages.map((_,i)=>(3+3*i)+' 0 R').join(' ')+']>>');
 pages.forEach((p,i)=>{
  const pg=3+3*i,c='q '+PW+' 0 0 '+PHt+' 0 0 cm /Im0 Do Q';
  obj(pg,'<</Type/Page/Parent 2 0 R/MediaBox[0 0 '+PW+' '+PHt+']/Resources<</XObject<</Im0 '+(pg+2)+' 0 R>>>>/Contents '+(pg+1)+' 0 R>>');
  obj(pg+1,'<</Length '+c.length+'>>\nstream\n'+c+'\nendstream');
  offs[pg+2]=len;
  put((pg+2)+' 0 obj\n<</Type/XObject/Subtype/Image/Width '+p.w+'/Height '+p.h+'/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length '+p.jpg.length+'>>\nstream\n');
  put(p.jpg);put('\nendstream\nendobj\n');
 });
 const N=3*n+3,x=len;
 let xr='xref\n0 '+N+'\n0000000000 65535 f \n';
 for(let i=1;i<N;i++)xr+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
 put(xr+'trailer\n<</Size '+N+'/Root 1 0 R>>\nstartxref\n'+x+'\n%%EOF');
 return new Blob(parts,{type:'application/pdf'});
}
/* Fabrique le PDF = photo exacte de la feuille affichée à l'écran */
function pdfBuild(){return withTO(pdfBuild0(),45000,'pdf timeout')}
async function pdfBuild0(){
 if(!PDFDOC)return null;
 await withTO(DOCREADY,12000,'doc timeout');
 const fr=$('#dfr');if(!fr)return null;
 const d=fr.contentDocument,{k:kk,id}=PDFDOC,D=DOC[kk],doc=S[kk].find(x=>x.id==id);if(!d||!doc)return null;
 sizeDoc();
 const W=SHEET_W,PH=SHEET_H,PM=Math.round(W*0.036),K=1400/W,H=Math.ceil(d.documentElement.scrollHeight);
 const xhtml=await sheetXhtml(d);
 // découpe en pages (jamais au milieu d'une ligne du tableau)
 let cuts=[];
 if(H<=PH*1.04)cuts=[[0,H,0]];
 else{
  const bots=[...d.querySelectorAll('.dtb tr,.m-tb tr,.m-tot tr,.m-top,.m-bxs,.m-bt,.m-sg,.m-ft,.dtt tr,.dwd,.dmr,.dbx,.dh,.eh')].map(e=>Math.round(e.getBoundingClientRect().bottom)).filter(v=>v>0).sort((a,b)=>a-b);
  let y0=0,first=true;
  while(H-y0>0){
   const room=PH-PM-(first?0:PM);
   if(H-y0<=room){cuts.push([y0,H,first?0:PM]);break}
   const c=bots.filter(v=>v>y0+room*0.4&&v<=y0+room),y1=c.length?c[c.length-1]:y0+room;
   cuts.push([y0,y1,first?0:PM]);y0=y1;first=false;
  }
 }
 const pages=[];
 for(let i=0;i<cuts.length;i++){
  const [y0,y1,off]=cuts[i],h=y1-y0,f=(cuts.length==1&&h>PH)?PH/h:1;
  const cv=document.createElement('canvas');cv.width=Math.round(W*K);cv.height=Math.round(PH*K);
  const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);
  await drawSlice(xhtml,H,y0,h,ctx,Math.round((W-W*f)/2*K),off*K,K*f,i==0&&!!FONTCSS);
  if(cuts.length>1){ctx.fillStyle='#16357a';ctx.font='bold '+Math.round(W*0.016*K)+'px sans-serif';ctx.textAlign='right';ctx.fillText('Page '+(i+1)+'/'+cuts.length,(W-W*0.03)*K,(PH-W*0.012)*K)}
  pages.push({jpg:await toJpg(cv),w:cv.width,h:cv.height});
 }
 const nm=(D.t+'_'+doc.num).replace(/[\\/:*?"<>|\s]+/g,'_')+'.pdf';
 return {name:nm,blob:jpegPdf(pages)};
}

async function pdfWA(r){
 const pf=new File([r.blob],r.name,{type:'application/pdf'});
 // Pièce jointe directe : le menu de partage du téléphone s'ouvre, on choisit WhatsApp, le PDF est joint comme document
 if(!navigator.share){pdfFallback(r,'Le partage de fichiers n’est pas disponible ici (navigateur non compatible, ou fichier ouvert dans une application intégrée). Ouvrez le logiciel dans Chrome ou Safari sur le téléphone.');return}
 try{await navigator.share({files:[pf],title:r.name})}
 catch(e){if(e&&e.name==='AbortError')return;pdfFallback(r,'Le téléphone a refusé le partage du fichier ('+((e&&e.name)||'erreur')+'). Ouvrez le logiciel dans Chrome ou Safari, pas dans une application intégrée.')}
}

 }

}

<script type="module">

import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

  apiKey: "AIzaSyDjNqfxVaowWK8Js3vHSrwttjKe8Pp4ch8",

  messagingSenderId: "655499493529",
  appId: "1:655499493529:web:efe2d62618c802a700b808"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const refDoc = doc(db, "qgtf-data", "principal");

const K = "qgtf_v1";                 // données du logiciel
const B = "qgtf_sync_base";          // dernière version synchronisée avec le cloud
const BK = "qgtf_backup_avant_sync"; // copie de sécurité avant remplacement
const loc = () => localStorage.getItem(K);
const base = () => localStorage.getItem(B);
const setBase = v => { try { localStorage.setItem(B, v); } catch (e) {} };
let ready = false, pushing = false;

async function push(v) {
  if (pushing) return;
  pushing = true;
  try { await setDoc(refDoc, { qgtf_v1: v, maj: Date.now() }); setBase(v); } catch (e) {}
  pushing = false;
}

function take(cloud) {
  try {
    const l = loc();
    if (l) localStorage.setItem(BK, l);
    localStorage.setItem(K, cloud);
    setBase(cloud);
  } catch (e) { return; }
  location.reload();
}

onSnapshot(refDoc, snap => {
  if (snap.metadata.fromCache || snap.metadata.hasPendingWrites) return;
  const cloud = snap.exists() ? snap.data().qgtf_v1 : null;
  const l = loc(), b = base();
  if (!cloud) { ready = true; if (l) push(l); return; }
  if (cloud === l) { setBase(cloud); ready = true; return; }
  if (!l) { take(cloud); return; }
  if (b !== null && l === b) { take(cloud); return; }
  if (b !== null && cloud === b) { ready = true; push(l); return; }
  if (confirm("Les données en ligne sont différentes de celles de cet appareil.\n\nOK = utiliser les données en ligne\nAnnuler = garder celles de cet appareil et remplacer les données en ligne")) take(cloud);
  else { ready = true; push(l); }
}, () => {});
